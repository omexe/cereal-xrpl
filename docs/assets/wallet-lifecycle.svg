<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="290" viewBox="0 0 1200 290" role="img" aria-labelledby="title desc">
<title id="title">One task. One wallet. A clear spending trail.</title>
<desc id="desc">Describe a task, approve its budget, pay credentialed vendors with two signatures, then reclaim funds and export the report.</desc>
<defs><pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#3030ef" opacity=".12"/></pattern></defs>
<rect width="1200" height="290" rx="20" fill="#f7f7ff"/>
<rect x="945" width="255" height="290" rx="20" fill="url(#dots)"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="36" y="46" font-size="24" font-weight="600" fill="#15151b">One task. One wallet. A clear spending trail.</text>
<rect x="36" y="78" width="255" height="176" rx="14" fill="white" stroke="#dedeee"/><circle cx="67" cy="111" r="15" fill="#3030ef"/><text x="67" y="116" text-anchor="middle" font-size="14" font-weight="600" fill="white">1</text><text x="58" y="162" font-size="23" fill="#2020e8">Describe</text><text x="58" y="196" font-size="16" fill="#555563">Set the task, budget</text><text x="58" y="219" font-size="16" fill="#555563">and spending rules.</text><path d="M302 164h14m-5-5 5 5-5 5" fill="none" stroke="#3030ef" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="327" y="78" width="255" height="176" rx="14" fill="white" stroke="#dedeee"/><circle cx="358" cy="111" r="15" fill="#3030ef"/><text x="358" y="116" text-anchor="middle" font-size="14" font-weight="600" fill="white">2</text><text x="349" y="162" font-size="23" fill="#2020e8">Approve</text><text x="349" y="196" font-size="16" fill="#555563">Review the conditions</text><text x="349" y="219" font-size="16" fill="#555563">before funding.</text><path d="M593 164h14m-5-5 5 5-5 5" fill="none" stroke="#3030ef" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="618" y="78" width="255" height="176" rx="14" fill="white" stroke="#dedeee"/><circle cx="649" cy="111" r="15" fill="#3030ef"/><text x="649" y="116" text-anchor="middle" font-size="14" font-weight="600" fill="white">3</text><text x="640" y="162" font-size="23" fill="#2020e8">Spend</text><text x="640" y="196" font-size="16" fill="#555563">Two signatures.</text><text x="640" y="219" font-size="16" fill="#555563">Credentialed vendors.</text><path d="M884 164h14m-5-5 5 5-5 5" fill="none" stroke="#3030ef" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="909" y="78" width="255" height="176" rx="14" fill="white" stroke="#dedeee"/><circle cx="940" cy="111" r="15" fill="#3030ef"/><text x="940" y="116" text-anchor="middle" font-size="14" font-weight="600" fill="white">4</text><text x="931" y="162" font-size="23" fill="#2020e8">Close</text><text x="931" y="196" font-size="16" fill="#555563">Reclaim what remains.</text><text x="931" y="219" font-size="16" fill="#555563">Export the report.</text></g></svg>
